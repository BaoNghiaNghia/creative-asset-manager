[package]
name = "cam-scout-manager"
version = "0.1.36"
description = "RRUGC Scout Manager desktop controller"
authors = ["Creative Asset Manager"]
license = "Proprietary"
edition = "2021"

[lib]
name = "cam_scout_manager"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.13", features = ["json", "blocking"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }