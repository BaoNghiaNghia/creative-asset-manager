name: creative-asset-manager

x-backend-common: &backend-common
  image: "${CAM_BACKEND_IMAGE:-creative-asset-manager-backend}:${BUILD_COMMIT:-local}"
  env_file:
    - "${CAM_PRODUCTION_ENV_FILE:-/etc/creative-asset-manager/production.env}"
  environment:
    BUILD_COMMIT: "${BUILD_COMMIT:-unknown}"
    ELASTICSEARCH_URL: "http://elasticsearch:9200"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - backend
  init: true
  user: "10001:10001"
  stop_signal: SIGTERM
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=256m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - backend
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    # Override these measured defaults through the production environment.
    cpus: "${CAM_ELASTICSEARCH_CPU_LIMIT:-2.0}"
    mem_limit: "${CAM_ELASTICSEARCH_MEMORY_LIMIT:-2g}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          >/dev/null
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    stop_grace_period: 1m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    <<: *backend-common
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    stop_grace_period: 45s
    cpus: "${CAM_API_CPU_LIMIT:-1.0}"
    mem_limit: "${CAM_API_MEMORY_LIMIT:-1g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *backend-common
    command: ["python", "/app/apps/worker/main.py"]
    depends_on:
      elasticsearch:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 45s
    cpus: "${CAM_WORKER_CPU_LIMIT:-1.0}"
    mem_limit: "${CAM_WORKER_MEMORY_LIMIT:-2g}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/live', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    <<: *backend-common
    profiles: ["migration"]
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on: {}
    cpus: "${CAM_MIGRATE_CPU_LIMIT:-1.0}"
    mem_limit: "${CAM_MIGRATE_MEMORY_LIMIT:-1g}"

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  elasticsearch-data:
