services:
  postgres:
    image: "${CAM_POSTGRES_IMAGE:-postgres:16.4}"
    environment:
      POSTGRES_DB: cam_integration
      POSTGRES_USER: cam_test
      POSTGRES_PASSWORD: cam_test
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cam_test -d cam_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1::9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
    tmpfs:
      - /usr/share/elasticsearch/data
