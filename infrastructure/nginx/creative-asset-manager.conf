# Replace assets.example.com and certificate paths before enabling this file.
# Nginx is the only public service and serves the committed frontend release.
map $uri $cam_cache_control {
    default "no-cache";
    "/index.html" "no-store, no-cache, must-revalidate";
    "/build-info.json" "no-store, no-cache, must-revalidate";
    ~^/assets/.*-[A-Za-z0-9_-]+[.][A-Za-z0-9]+$ "public, max-age=31536000, immutable";
}

upstream creative_asset_manager_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name assets.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name assets.example.com;

    ssl_certificate /etc/letsencrypt/live/assets.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assets.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CAMTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/creative-asset-manager/current;
    index index.html;
    client_max_body_size 256m;
    client_body_timeout 60s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 60s;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'self'" always;
    add_header Cache-Control $cam_cache_control always;

    location /api/ {
        proxy_pass http://creative_asset_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    location = /live {
        proxy_pass http://creative_asset_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /ready {
        proxy_pass http://creative_asset_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location = /version {
        proxy_pass http://creative_asset_manager_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location = /build-info.json {
        try_files $uri =404;
        default_type application/json;
    }

    # This fallback serves deep links including /ai-operations and
    # /settings/access from the committed single-page application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ (^|/)[.] {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* (^|/)(?:[.]?env(?:[.]|$)|[^/]*[.](?:ini|log|sql|key|pem)$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
