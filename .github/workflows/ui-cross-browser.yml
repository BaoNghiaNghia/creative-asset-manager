name: UI Cross-Browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  mobile-webkit:
    name: Mobile WebKit fixture smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/client
        run: npm ci
      - name: Install Playwright WebKit runtime
        working-directory: apps/client
        run: npx playwright install --with-deps webkit
      - name: Build UI
        working-directory: apps/client
        run: npm run build
      - name: Test mobile WebKit against deterministic fixtures
        env:
          CAM_UI_QA_BROWSER: webkit
          CAM_UI_QA_BROWSER_PREINSTALLED: "1"
          CAM_UI_VIEWPORTS: mobile
          CAM_UI_VISUAL_SKIP: "1"
          CAM_UI_QA_PROFILES: "explorer-viewer,realistic-review-ugc,public-review"
        run: bash scripts/cam-ui-profile-matrix.sh
      - name: Upload WebKit QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-webkit-qa
          path: apps/client/.ui-qa/
          if-no-files-found: ignore
          retention-days: 7
