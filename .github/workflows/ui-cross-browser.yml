name: UI Cross-Browser QA

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

jobs:
  mobile-engines:
    name: Mobile ${{ matrix.engine }} fixture smoke
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/client
        run: npm ci
      - name: Install Playwright browser runtime
        working-directory: apps/client
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build UI
        working-directory: apps/client
        run: npm run build
      - name: Test mobile engine against deterministic fixtures
        env:
          CAM_UI_QA_BROWSER: ${{ matrix.engine }}
          CAM_UI_QA_BROWSER_PREINSTALLED: "1"
          CAM_UI_VIEWPORTS: mobile
          CAM_UI_VISUAL_SKIP: "1"
          CAM_UI_QA_PROFILES: "explorer-viewer,realistic-review-ugc,public-review"
        run: bash scripts/cam-ui-profile-matrix.sh
      - name: Prepare UGC visual baseline review packet
        run: node apps/client/scripts/ui-qa-visual-review.mjs --profile realistic-review-ugc --latest
      - name: Upload cross-browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.engine }}-qa
          path: apps/client/.ui-qa/
          if-no-files-found: ignore
          retention-days: 7
