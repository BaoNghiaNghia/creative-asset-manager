name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Static validation
        run: npm run typecheck
      - name: Unit and component tests
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/frontend
          npm test 2>&1 | tee ../../artifacts/frontend/tests.log
      - name: Production build matches committed dist
        run: |
          test -f dist/build-info.json
          export BUILD_COMMIT="$(node -e 'const value=require("./dist/build-info.json").build_commit; process.stdout.write(value)')"
          export BUILD_UTC_TIMESTAMP="$(node -e 'const value=require("./dist/build-info.json").build_utc_timestamp; process.stdout.write(value)')"
          npm run build
          git diff --exit-code -- dist
          test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - name: Upload frontend failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure
          path: artifacts/frontend
          if-no-files-found: ignore
          retention-days: 7

  api-unit:
    name: API, worker and provider unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Shell and Python syntax checks
        run: |
          bash -n scripts/dev-api.sh
          bash -n scripts/test-integration.sh
          python -m compileall -q apps/api/app apps/worker apps/inventory_worker
      - name: API, worker and mocked-provider tests
        working-directory: apps/api
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/api-unit
          timeout 10m python - <<'PY' 2>&1 | tee ../../artifacts/api-unit/tests.log
          import unittest
          import sys
          sys.argv.append("unittest")
          from app.core.test_bootstrap import activate_test_environment
          activate_test_environment()

          loader = unittest.defaultTestLoader
          discovered = loader.discover("tests")

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          # Integration and migration suites run in their dedicated jobs. Keep
          # this job bounded to API/worker/provider unit coverage instead of
          # rerunning full Alembic histories without their services.
          selected = [
              test for test in flatten(discovered)
              if not any(part in {"integration", "migrations"} for part in test.id().split("."))
          ]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Application import smoke test
        working-directory: apps/api
        run: python -c "from app.main import app; assert app.title == 'Creative Asset Manager API'"
      - name: Upload API failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-unit-failure
          path: artifacts/api-unit
          if-no-files-found: ignore
          retention-days: 7

  postgres-integration:
    name: PostgreSQL migrations and repositories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: cam_integration
          POSTGRES_USER: cam_test
          POSTGRES_PASSWORD: cam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cam_test -d cam_integration"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://cam_test:cam_test@127.0.0.1:5432/cam_integration
      INTEGRATION_DATABASE_URL: postgresql+psycopg://cam_test:cam_test@127.0.0.1:5432/cam_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Verify database readiness
        run: |
          timeout 30s python - <<'PY'
          import os, time
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["DATABASE_URL"])
          for attempt in range(30):
              try:
                  with engine.connect() as connection:
                      connection.execute(text("SELECT 1"))
                  break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY
      - name: Upgrade, verify one head, rollback and re-upgrade
        working-directory: apps/api
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/postgres
          test "$(python -m alembic heads | grep -c '(head)')" -eq 1
          python -m alembic upgrade head 2>&1 | tee ../../artifacts/postgres/migration-upgrade.log
          python -m alembic downgrade 0012_ai_batch_processing 2>&1 | tee ../../artifacts/postgres/migration-downgrade.log
          python -m alembic upgrade head 2>&1 | tee -a ../../artifacts/postgres/migration-upgrade.log
      - name: Repository and migration integration tests
        working-directory: apps/api
        run: |
          set -o pipefail
          timeout 10m python -m unittest tests.integration.test_postgresql tests.integration.test_ai_operations_postgresql tests.integration.test_inventory_postgresql -v 2>&1 | tee ../../artifacts/postgres/tests.log
      - name: Upload PostgreSQL failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-failure
          path: artifacts/postgres
          if-no-files-found: ignore
          retention-days: 7

  elasticsearch-integration:
    name: Elasticsearch v2 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      INTEGRATION_ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Verify Elasticsearch readiness
        run: timeout 60s bash -c 'until curl -fsS "$ELASTICSEARCH_URL/_cluster/health?wait_for_status=yellow" >/dev/null; do sleep 2; done'
      - name: Mapping, indexing, aliases and query integration tests
        working-directory: apps/api
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/elasticsearch
          timeout 10m python -m unittest tests.integration.test_elasticsearch -v 2>&1 | tee ../../artifacts/elasticsearch/tests.log
      - name: Capture safe Elasticsearch diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/elasticsearch
          curl -fsS "$ELASTICSEARCH_URL/_cluster/health?pretty" > artifacts/elasticsearch/cluster-health.json || true
          curl -fsS "$ELASTICSEARCH_URL/_cat/indices?v" > artifacts/elasticsearch/indices.txt || true
          curl -fsS "$ELASTICSEARCH_URL/_cat/aliases?v" > artifacts/elasticsearch/aliases.txt || true
      - name: Upload Elasticsearch failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-integration-failure
          path: artifacts/elasticsearch
          if-no-files-found: ignore
          retention-days: 7

  pipeline-e2e:
    name: Durable pipeline end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: cam_pipeline
          POSTGRES_USER: cam_test
          POSTGRES_PASSWORD: cam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cam_test -d cam_pipeline"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
    env:
      DATABASE_URL: postgresql+psycopg://cam_test:cam_test@127.0.0.1:5432/cam_pipeline
      INTEGRATION_DATABASE_URL: postgresql+psycopg://cam_test:cam_test@127.0.0.1:5432/cam_pipeline
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      INTEGRATION_ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r apps/api/requirements.txt
      - name: Migrate pipeline database
        working-directory: apps/api
        run: python -m alembic upgrade head
      - name: Real worker runtime pipeline and bounded failure paths
        working-directory: apps/api
        run: |
          set -o pipefail
          mkdir -p ../../artifacts/pipeline-e2e
          timeout 15m python -m unittest tests.integration.test_pipeline_e2e -v 2>&1 | tee ../../artifacts/pipeline-e2e/tests.log
      - name: Capture safe pipeline diagnostics
        if: failure()
        run: |
          mkdir -p artifacts/pipeline-e2e
          curl -fsS "$ELASTICSEARCH_URL/_cluster/health?pretty" > artifacts/pipeline-e2e/cluster-health.json || true
          curl -fsS "$ELASTICSEARCH_URL/_cat/indices?v" > artifacts/pipeline-e2e/indices.txt || true
      - name: Upload pipeline failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-e2e-failure
          path: artifacts/pipeline-e2e
          if-no-files-found: ignore
          retention-days: 7



  production-release-gate:
    name: Production release gate
    if: always()
    needs:
      - frontend
      - api-unit
      - postgres-integration
      - elasticsearch-integration
      - pipeline-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: cam_release_gate
          POSTGRES_USER: cam_gate
          POSTGRES_PASSWORD: cam_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cam_gate -d cam_release_gate"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Require all existing CI groups
        run: |
          test "${{ needs.frontend.result }}" = success
          test "${{ needs.api-unit.result }}" = success
          test "${{ needs.postgres-integration.result }}" = success
          test "${{ needs.elasticsearch-integration.result }}" = success
          test "${{ needs.pipeline-e2e.result }}" = success
      - uses: actions/checkout@v4
      - name: Install native Nginx syntax validator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nginx openssl
      - name: Create ephemeral fail-closed production configuration
        run: |
          umask 077
          cat >"$RUNNER_TEMP/cam-production-gate.env" <<EOF
          APP_ENV=production
          PUBLIC_APP_URL=https://asset.example.com
          CORS_ALLOWED_ORIGINS=https://asset.example.com
          TRUSTED_HOSTS=asset.example.com
          API_DOCS_ENABLED=false
          BUILD_COMMIT=$GITHUB_SHA
          CAM_BACKEND_IMAGE=cam-production-gate
          CAM_API_MEMORY_LIMIT=1g
          CAM_WORKER_MEMORY_LIMIT=1g
          CAM_MIGRATE_MEMORY_LIMIT=1g
          CAM_ELASTICSEARCH_MEMORY_LIMIT=1g
          ES_JAVA_OPTS=-Xms512m -Xmx512m
          PROXY_HEADERS_ENABLED=true
          PROXY_TRUSTED_IPS=172.29.0.1/32
          DATABASE_URL=postgresql+psycopg://cam_gate:cam_gate@host.docker.internal:5432/cam_release_gate
          ELASTICSEARCH_URL=http://elasticsearch:9200
          AUTH_COOKIE_SECURE=true
          PERSISTENT_AUTH_ENABLED=true
          OAUTH_TOKEN_ENCRYPTION_KEYS=v1:a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          OAUTH_ACTIVE_KEY_VERSION=v1
          DEVELOPMENT_PERSONAL_TENANT_ENABLED=false
          AUTH_SELF_SIGNUP_ENABLED=false
          AUTH_PROCESSING_ADMIN_ALLOWLIST_COMPAT_ENABLED=false
          PROCESSING_POLICY_ADMIN_IDS=
          SENSITIVE_URL_ENCRYPTION_KEYS=v1:c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
          SENSITIVE_URL_ACTIVE_KEY_VERSION=v1
          AI_EMERGENCY_STOP_ENABLED=true
          OPENAI_AI_ENABLED=false
          PROCESSING_JOBS_ENABLED=false
          UNIFIED_ASSET_INGESTION_ENABLED=false
          CONTENT_DEDUP_ENABLED=false
          INCREMENTAL_SOURCE_SYNC_ENABLED=false
          EXTERNAL_ASSET_DOWNLOADER_ENABLED=false
          MANAGED_ASSET_STORAGE_ENABLED=false
          DYNAMIC_AI_METADATA_ENABLED=false
          AI_SINGLE_ANALYSIS_ENABLED=false
          AI_BATCH_ANALYSIS_ENABLED=false
          AI_AUTO_ANALYZE_ENABLED=false
          SEARCH_PROJECTION_ENABLED=false
          ELASTICSEARCH_V2_ENABLED=false
          SEARCH_QUERY_PARSER_V2_ENABLED=false
          EXTERNAL_INGESTION_API_ENABLED=false
          DRIVE_METADATA_SIDECAR_ENABLED=false
          EOF
          echo "CAM_PRODUCTION_ENV_FILE=$RUNNER_TEMP/cam-production-gate.env" >>"$GITHUB_ENV"
          echo "BUILD_COMMIT=$GITHUB_SHA" >>"$GITHUB_ENV"
          echo "CAM_BACKEND_IMAGE=cam-production-gate" >>"$GITHUB_ENV"
      - name: Run production release gate
        run: |
          set -o pipefail
          mkdir -p artifacts/production-gate
          ./scripts/production-release-gate.sh \
            --env-file "$CAM_PRODUCTION_ENV_FILE" \
            --project-root "$GITHUB_WORKSPACE" \
            2>&1 | tee artifacts/production-gate/gate.log
      - name: Upload safe production gate diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-gate-failure
          path: artifacts/production-gate
          if-no-files-found: ignore
          retention-days: 7
