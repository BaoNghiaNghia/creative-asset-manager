name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package.json
      - run: npm install
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/dev-api.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/app
      - run: python -c "from app.main import app; assert app.title == 'Creative Asset Manager API'"
        working-directory: apps/api
      - name: Verify Google OAuth PKCE transaction
        working-directory: apps/api
        env:
          GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-secret
        run: |
          python - <<'PY'
          from app.providers.google.auth import consume_state, oauth_flow, remember_state

          flow = oauth_flow()
          _, state = flow.authorization_url(access_type="offline", prompt="consent")
          assert flow.code_verifier
          remember_state(state, flow.code_verifier)
          assert consume_state(state) == flow.code_verifier
          PY
