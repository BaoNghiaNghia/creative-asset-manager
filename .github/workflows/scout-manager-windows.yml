name: RRUGC Scout Manager Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/scout-manager-desktop/**"
      - "apps/rrugc_scout/**"
      - "apps/branding-dna-worker/**"
      - ".github/workflows/scout-manager-windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/scout-manager-desktop/**"
      - "apps/rrugc_scout/**"
      - "apps/branding-dna-worker/**"
      - "START_SCOUT_BRANDING_DNA.cmd"
      - "UPDATE_SCOUT_MANAGER_RELEASE.cmd"
      - "scripts/build_scout_manager_tauri.ps1"
      - "scripts/install_scout_manager_release.ps1"
      - "scripts/check_scout_manager_versions.py"
      - ".github/workflows/scout-manager-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # CodeLocal and some CI environments use CI=1, which Tauri does not accept.
      CI: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: apps/scout-manager-desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/scout-manager-desktop/src-tauri -> target
      - name: Install locked frontend dependencies
        working-directory: apps/scout-manager-desktop
        run: npm ci --no-audit --no-fund
      - name: React UI regression tests
        working-directory: apps/scout-manager-desktop
        run: npm test
      - name: Branding DNA browser agent package tests (no live scanning)
        working-directory: apps/branding-dna-worker
        shell: pwsh
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/build_windows_release.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/build_windows_release.py --verify ../../releases/branding-dna/BrandingDNA-BrowserAgent-v0.2.8-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload current Branding DNA Windows bootstrap package
        uses: actions/upload-artifact@v4
        with:
          name: BrandingDNA-BrowserAgent-v0.2.8-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            releases/branding-dna/BrandingDNA-BrowserAgent-v0.2.8-win-x64.zip
            releases/branding-dna/BrandingDNA-BrowserAgent-v0.2.8-win-x64.zip.sha256
      - name: Validate Windows release installer script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install_scout_manager_release.ps1").Path,
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host "PowerShell installer parser passed"
      - name: Windows preflight for release downloader (previous immutable release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = (Resolve-Path "scripts/install_scout_manager_release.ps1").Path
          $directory = Join-Path $env:RUNNER_TEMP "scout-previous-release-preflight"
          Write-Host "::group::Download and install known-good 0.1.22 fixture"
          try {
            & $installer -DestinationDir $directory -ReleaseVersion "0.1.22"
            & $installer -DestinationDir $directory -ReleaseVersion "0.1.22"
            if ((Get-Content (Join-Path $directory "RRUGC_Scout_Manager_Active_Version.txt") -Raw).Trim() -ne "0.1.22") {
              throw "Active marker not written or not idempotent"
            }
            Write-Host "Windows installer preflight PASSED"
          } catch {
            Write-Host ("::error::Windows installer preflight: " + $_.Exception.Message.Replace("%","%25"))
            throw
          } finally {
            Write-Host "::endgroup::"
          }
      - name: Validate Scout Manager manifest and dependency lockfile
        shell: pwsh
        run: python scripts/check_scout_manager_versions.py
      - name: Rust native regression tests
        shell: pwsh
        run: |
          cargo test --manifest-path apps/scout-manager-desktop/src-tauri/Cargo.toml -- --nocapture 2>&1 | Tee-Object -FilePath rust-tests.log
          if ($LASTEXITCODE -ne 0) {
            # Emit bounded error annotations so remote diagnostics remain
            # actionable even when GitHub job logs are inaccessible.
            Get-Content -LiteralPath rust-tests.log -Tail 100 |
              Where-Object { $_ -match '(?i)error|FAILED|panicked|assertion failed|could not compile|test result' } |
              Select-Object -First 15 |
              ForEach-Object {
                $safe = (($_ -replace '%', '%25') -replace '\r', '%0D') -replace '\n', '%0A'
                Write-Output "::error::$safe"
              }
            exit 1
          }
      - name: Upload Rust failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Scout-Manager-Rust-failure
          path: rust-tests.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Build Tauri NSIS installer and portable executable
        working-directory: apps/scout-manager-desktop
        run: npm run tauri:build
      - name: Upload Windows installer and portable build
        uses: actions/upload-artifact@v4
        with:
          name: RRUGC-Scout-Manager-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/scout-manager-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/scout-manager-desktop/src-tauri/target/release/cam-scout-manager.exe
      - name: Publish verified versioned Scout Manager release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $version = [string]((Get-Content "apps/scout-manager-desktop/package.json" -Raw | ConvertFrom-Json).version)
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unsafe Scout Manager version" }
          $tag = "scout-manager-v" + $version
          $source = "apps/scout-manager-desktop/src-tauri/target/release"
          $setup = Join-Path $source ("bundle/nsis/RRUGC Scout Manager_" + $version + "_x64-setup.exe")
          $portable = Join-Path $source "cam-scout-manager.exe"
          if (-not (Test-Path -LiteralPath $setup) -or -not (Test-Path -LiteralPath $portable)) {
            throw "Windows installer or portable executable not built"
          }
          $out = Join-Path $env:RUNNER_TEMP ("RRUGC-Scout-Manager-" + $version)
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $names = @(
            ("RRUGC_Scout_Manager_" + $version + "_x64_Setup.exe"),
            ("RRUGC_Scout_Manager_" + $version + "_x64_Portable.exe")
          )
          Copy-Item -LiteralPath $setup -Destination (Join-Path $out $names[0])
          Copy-Item -LiteralPath $portable -Destination (Join-Path $out $names[1])
          $hashName = "RRUGC_Scout_Manager_" + $version + "_SHA256.txt"
          $hashPath = Join-Path $out $hashName
          $checks = @()
          foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $out $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            $checks += ($hash + "  " + $name)
          }
          [IO.File]::WriteAllText($hashPath, (($checks -join [char]10) + [char]10), [Text.Encoding]::ASCII)
          $agentVersion = [string]((Get-Content "apps/branding-dna-worker/package.json" -Raw | ConvertFrom-Json).version)
          $agentZip = "releases/branding-dna/BrandingDNA-BrowserAgent-v" + $agentVersion + "-win-x64.zip"
          $agentChecksum = $agentZip + ".sha256"
          if (-not (Test-Path -LiteralPath $agentZip) -or -not (Test-Path -LiteralPath $agentChecksum)) {
            throw "Branding DNA Windows bootstrap archive is missing"
          }
          $assets = @((Join-Path $out $names[0]), (Join-Path $out $names[1]), $hashPath, $agentZip, $agentChecksum)
          # Never mutate a published release: keep historical installer hashes
          # stable for machines already using the same tag.
          & gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw ("Release already exists: " + $tag + ". Bump the app version before publishing another binary.")
          }
          & gh release create $tag @assets --target $env:GITHUB_SHA --title ("RRUGC Scout Manager " + $version + " with Branding DNA") --notes "Windows NSIS installer and portable EXE for the existing Scan Pinterest tool. Includes manually gated Amazon/Etsy Branding DNA pilot. Existing Scout profiles and pairing are preserved; no automatic marketplace scans. SHA-256 hashes included."
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publication failed" }
          Write-Host ("Published immutable " + $tag + " with checksums")
      - name: Windows release install / idempotence / corruption smoke
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = [string]((Get-Content "apps/scout-manager-desktop/package.json" -Raw | ConvertFrom-Json).version)
          $destination = Join-Path $env:RUNNER_TEMP "scout-manager-releases-test"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          $legacy = Join-Path $destination "RRUGC_Scout_Manager_0.1.0_x64_Portable.exe"
          [IO.File]::WriteAllText($legacy, "Do not delete old Scout versions")
          $installer = (Resolve-Path "scripts/install_scout_manager_release.ps1").Path
          & $installer -DestinationDir $destination
          $portable = Join-Path $destination ("RRUGC_Scout_Manager_" + $version + "_x64_Portable.exe")
          $setup = Join-Path $destination ("RRUGC_Scout_Manager_" + $version + "_x64_Setup.exe")
          $marker = Join-Path $destination "RRUGC_Scout_Manager_Active_Version.txt"
          if (-not (Test-Path $portable) -or -not (Test-Path $setup) -or
              -not (Test-Path $legacy) -or
              (Get-Content -LiteralPath $marker -Raw).Trim() -ne $version) {
            throw "Downloaded release files or active marker are incorrect"
          }
          & $installer -DestinationDir $destination
          if (-not (Test-Path -LiteralPath $legacy)) { throw "Legacy release was removed" }
          [IO.File]::AppendAllText($portable, "tamper-test")
          $blocked = $false
          try {
            & $installer -DestinationDir $destination
          } catch {
            if ($_.Exception.Message -match 'Refusing overwrite') { $blocked = $true }
            else { throw }
          }
          if (-not $blocked) { throw "Installer accepted tampered existing portable" }
          if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne $version) {
            throw "Installer corrupted active release marker"
          }
          Write-Host "Windows release smoke passed: download, checksum, active version, idempotence, tamper refusal and legacy preservation"
      - name: Verify Scout launcher selects active release over timestamps
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = [string]((Get-Content "apps/scout-manager-desktop/package.json" -Raw | ConvertFrom-Json).version)
          $downloads = Join-Path $env:RUNNER_TEMP "scout-manager-releases-test"
          $local = Join-Path $env:GITHUB_WORKSPACE "scout-manager-releases"
          New-Item -ItemType Directory -Force -Path $local | Out-Null
          $portable = "RRUGC_Scout_Manager_" + $version + "_x64_Portable.exe"
          Copy-Item -LiteralPath (Join-Path $downloads $portable) -Destination (Join-Path $local $portable)
          $older = Join-Path $local "RRUGC_Scout_Manager_0.0.1_x64_Portable.exe"
          [IO.File]::WriteAllText($older, "legacy marker only; never execute")
          (Get-Item -LiteralPath $older).LastWriteTime = (Get-Date).AddDays(2)
          [IO.File]::WriteAllText((Join-Path $local "RRUGC_Scout_Manager_Active_Version.txt"), ($version + [char]10))
          $env:CAM_SCOUT_MANAGER_RESOLVE_ONLY = "1"
          $result = & cmd.exe /D /C "START_SCOUT_TAURI.cmd"
          if ($LASTEXITCODE -ne 0 -or ($result -join " ") -notlike ("*RRUGC_Scout_Manager_" + $version + "_x64_Portable.exe*")) {
            throw ("Incorrect Scout executable chosen: " + ($result -join " "))
          }
          Write-Host ("Correct verified Scout Manager release selected: " + $version)